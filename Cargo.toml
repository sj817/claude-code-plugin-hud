[package]
name = "claude-code-plugin-hud"
version = "0.1.4"
edition = "2021"
description = "Lightweight, fixed-height statusline HUD for Claude Code"
license = "MIT"
repository = "https://github.com/sj817/claude-code-plugin-hud"

[[bin]]
name = "claude-hud"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
opt-level = "z"     # optimize for binary size — the HUD runs often but does tiny work
lto = true
codegen-units = 1
panic = "abort"
strip = true
