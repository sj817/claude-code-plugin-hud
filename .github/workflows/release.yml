name: Release

# Fully automated, conventional-commits driven release.
#
# Push commits to main with conventional messages and CI does the rest:
#   feat!: / BREAKING CHANGE  -> major   (1.2.3 -> 2.0.0)
#   feat:                     -> minor   (1.2.3 -> 1.3.0)
#   fix: / perf: / refactor:  -> patch   (1.2.3 -> 1.2.4)
#   only docs/chore/ci/test/style -> no release
#
# On a release it: builds all targets, drops the binaries into dist/<triple>/,
# bumps Cargo.toml, commits "chore(release): vX.Y.Z [skip ci]", tags it, and
# publishes a GitHub Release. The [skip ci] tag prevents an infinite loop.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: compute version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.calc.outputs.release }}
      version: ${{ steps.calc.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: calc
        run: |
          set -euo pipefail
          last_tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$last_tag" ]; then
            range=""
            base="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')"
          else
            range="$last_tag..HEAD"
            base="${last_tag#v}"
          fi
          log=$(git log --format='%s%n%b' $range)

          bump=none
          if echo "$log" | grep -qE '^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE'; then
            bump=major
          elif echo "$log" | grep -qE '^feat(\([^)]*\))?:'; then
            bump=minor
          elif echo "$log" | grep -qE '^(fix|perf|refactor)(\([^)]*\))?:'; then
            bump=patch
          fi

          # No prior tag => first release uses the current Cargo.toml version.
          if [ -z "$last_tag" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$base" >> "$GITHUB_OUTPUT"
            echo "First release -> v$base"
            exit 0
          fi

          if [ "$bump" = none ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commits since $last_tag"
            exit 0
          fi

          IFS=. read -r MA MI PA <<< "$base"
          case "$bump" in
            major) MA=$((MA+1)); MI=0; PA=0;;
            minor) MI=$((MI+1)); PA=0;;
            patch) PA=$((PA+1));;
          esac
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$MA.$MI.$PA" >> "$GITHUB_OUTPUT"
          echo "$bump bump: $base -> $MA.$MI.$PA"

  build:
    name: build ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,   bin: claude-hud,     cross: false }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu,  bin: claude-hud,     cross: true }
          - { os: macos-latest,   target: x86_64-apple-darwin,        bin: claude-hud,     cross: false }
          - { os: macos-latest,   target: aarch64-apple-darwin,       bin: claude-hud,     cross: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     bin: claude-hud.exe, cross: false }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install aarch64 linux cross linker
        if: matrix.cross
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p "stage/${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "stage/${{ matrix.target }}/"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: stage/${{ matrix.target }}/${{ matrix.bin }}

  publish:
    name: commit dist · tag · release
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Assemble dist/ and zips
        run: |
          set -euo pipefail
          mkdir -p dist
          # incoming/<triple>/<bin> -> dist/<triple>/<bin>
          cp -r incoming/* dist/
          chmod +x dist/*/claude-hud 2>/dev/null || true
          mkdir -p release
          for d in dist/*/; do
            t=$(basename "$d")
            (cd dist && zip -r "../release/claude-code-plugin-hud-$t.zip" "$t")
          done

      - name: Bump Cargo.toml version
        run: |
          sed -i -E "0,/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"/s//version = \"$VERSION\"/" Cargo.toml
          # Keep Cargo.lock in sync for the package entry.
          cargo update -p claude-code-plugin-hud --precise "$VERSION" 2>/dev/null || true

      - name: Commit, tag, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock dist
          git commit -m "chore(release): v$VERSION [skip ci]"
          git tag "v$VERSION"
          git push origin main --follow-tags

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: release/*.zip
          generate_release_notes: true
