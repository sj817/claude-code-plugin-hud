name: Release

# Tag-triggered release. Pick a version and push the tag:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Every target builds on its own NATIVE runner (no cross-compilation) — GitHub
# provides native ARM runners for Windows, Linux, and macOS. CI drops the
# binaries into dist/<triple>/, syncs Cargo.toml to the tag version, commits
# that back to main (so `/plugin install` ships working binaries), and publishes
# a GitHub Release with zipped assets.
#
# A single target failing does not block the release (publish runs `if: always()`
# and is non-destructive — a missing target keeps its previously committed binary).
#
# Requires: Settings -> Actions -> Workflow permissions -> "Read and write".

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS arches build on one Apple-Silicon runner: the Apple
          # toolchain targets x86_64 and arm64 natively (Intel macos-13 runners
          # are being retired and now hang waiting for a runner).
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,      bin: claude-hud.exe }
          - { os: windows-11-arm,   target: aarch64-pc-windows-msvc,     bin: claude-hud.exe }
          - { os: macos-latest,     target: x86_64-apple-darwin,         bin: claude-hud }
          - { os: macos-latest,     target: aarch64-apple-darwin,        bin: claude-hud }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,    bin: claude-hud }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,   bin: claude-hud }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl,   bin: claude-hud, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl,  bin: claude-hud, musl: true }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p "stage/${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "stage/${{ matrix.target }}/"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: stage/${{ matrix.target }}/${{ matrix.bin }}

  publish:
    name: commit dist · release
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Assemble dist/ and zips
        run: |
          set -euo pipefail
          mkdir -p dist
          # incoming/<triple>/<bin> -> dist/<triple>/<bin> (non-destructive: any
          # target that failed to build keeps its previously committed binary).
          cp -r incoming/* dist/ 2>/dev/null || true
          chmod +x dist/*/claude-hud 2>/dev/null || true
          mkdir -p release
          for d in dist/*/; do
            t=$(basename "$d")
            (cd dist && zip -r "../release/claude-code-plugin-hud-$t.zip" "$t")
          done

      - name: Sync Cargo.toml version
        run: |
          sed -i -E "0,/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"/s//version = \"$VERSION\"/" Cargo.toml
          cargo update -p claude-code-plugin-hud --precise "$VERSION" 2>/dev/null || true

      - name: Commit binaries to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock dist
          git diff --cached --quiet || git commit -m "chore(release): v$VERSION [skip ci]"
          git push origin main || true

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
