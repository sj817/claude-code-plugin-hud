name: Release

# Tag-triggered release. Pick a version and push the tag:
#   git tag v0.1.0 && git push origin v0.1.0
#
# CI then builds every platform, drops the binaries into dist/<triple>/, syncs
# Cargo.toml to the tag version, commits that back to main (so `/plugin install`
# ships working binaries), and publishes a GitHub Release with zipped assets.
#
# Requires: Settings -> Actions -> Workflow permissions -> "Read and write".

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,   bin: claude-hud,     cross: false }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu,  bin: claude-hud,     cross: true }
          - { os: macos-latest,   target: x86_64-apple-darwin,        bin: claude-hud,     cross: false }
          - { os: macos-latest,   target: aarch64-apple-darwin,       bin: claude-hud,     cross: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     bin: claude-hud.exe, cross: false }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install aarch64 linux cross linker
        if: matrix.cross
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p "stage/${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "stage/${{ matrix.target }}/"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: stage/${{ matrix.target }}/${{ matrix.bin }}

  publish:
    name: commit dist · release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Assemble dist/ and zips
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -r incoming/* dist/          # incoming/<triple>/<bin> -> dist/<triple>/<bin>
          chmod +x dist/*/claude-hud 2>/dev/null || true
          mkdir -p release
          for d in dist/*/; do
            t=$(basename "$d")
            (cd dist && zip -r "../release/claude-code-plugin-hud-$t.zip" "$t")
          done

      - name: Sync Cargo.toml version
        run: |
          sed -i -E "0,/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"/s//version = \"$VERSION\"/" Cargo.toml
          cargo update -p claude-code-plugin-hud --precise "$VERSION" 2>/dev/null || true

      - name: Commit binaries to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock dist
          git diff --cached --quiet || git commit -m "chore(release): v$VERSION [skip ci]"
          git push origin main || true

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
