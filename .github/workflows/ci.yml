name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows-installer:
    name: installer - Windows PowerShell 5.1 and PowerShell 7
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pipeline and file installation on Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/test-install.ps1
      - name: Check pipeline and file installation on PowerShell 7
        shell: pwsh
        run: ./scripts/test-install.ps1

  check:
    name: fmt · clippy · build · smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --release -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release

      - name: Smoke test (minimal and classic heights)
        run: |
          out=$(echo '{"model":{"display_name":"Opus 4.8 (1M context)"},"workspace":{"current_dir":"/home/u/proj"},"context_window":{"used_percentage":25,"total_input_tokens":50000,"context_window_size":200000},"cost":{"total_cost_usd":1.0,"total_duration_ms":60000,"total_lines_added":10,"total_lines_removed":2},"version":"2.1.161","session_id":"ci"}' \
            | COLUMNS=120 LINES=24 ./target/release/claude-hud)
          echo "$out"
          lines=$(printf '%s\n' "$out" | wc -l)
          test "$lines" -eq 2 || { echo "expected 2 minimal lines, got $lines"; exit 1; }
          classic=$(echo '{}' | COLUMNS=120 LINES=24 CLAUDE_HUD_STYLE=classic ./target/release/claude-hud)
          test "$(printf '%s\n' "$classic" | wc -l)" -eq 2
          compact=$(echo '{}' | COLUMNS=120 LINES=24 CLAUDE_HUD_ONELINE=1 ./target/release/claude-hud)
          test "$(printf '%s\n' "$compact" | wc -l)" -eq 1
